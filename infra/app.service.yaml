# Servicio de Cloud Run de la aplicación. infra/desplegar.sh cambia __VERSION__ por la etiqueta de
# la imagen y lo aplica con gcloud run services replace.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: verdeazul-app
  labels:
    cloud.googleapis.com/location: us-east1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Cero instancias sin tráfico y dos como máximo: lo que mantiene el costo en la capa gratuita.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/startup-cpu-boost: "true"
        # La aplicación arranca solo cuando el motor de decisión pasó su sonda de inicio: sin OPA,
        # la instancia no recibe tráfico (K-3).
        run.googleapis.com/container-dependencies: '{"app":["politica"]}'
    spec:
      # Su propia cuenta de servicio, nunca la de Compute: solo puede leer sus tres secretos.
      serviceAccountName: sa-app@verdeazul-ce1115-g6.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - name: app
          image: us-east1-docker.pkg.dev/verdeazul-ce1115-g6/verdeazul/app:__VERSION__
          ports:
            - name: http1
              containerPort: 8080
          env:
            # Las dos direcciones que Cloud Run le da al servicio; cualquier otro Host recibe 400.
            - name: DJANGO_ALLOWED_HOSTS
              value: verdeazul-app-708901712393.us-east1.run.app,verdeazul-app-3jui2vuggq-ue.a.run.app
            - name: DJANGO_CSRF_TRUSTED_ORIGINS
              value: https://verdeazul-app-708901712393.us-east1.run.app
            # Los secretos llegan de Secret Manager, en una versión fija: rotarlos es un cambio
            # visible en este archivo.
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-secret-key
                  key: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-url-app
                  key: "1"
            - name: MFA_CLAVE
              valueFrom:
                secretKeyRef:
                  name: mfa-clave
                  key: "1"
            # El motor de decisión, en la misma instancia (tarea 4.5).
            - name: OPA_URL
              value: http://localhost:8181
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
        # Motor de decisión (OPA) como contenedor auxiliar. No declara puertos: desde internet solo
        # se llega a la aplicación, y la aplicación le pregunta por localhost (frontera F3).
        - name: politica
          image: us-east1-docker.pkg.dev/verdeazul-ce1115-g6/verdeazul/politica:__VERSION__
          startupProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 30
          resources:
            limits:
              cpu: "0.5"
              memory: 256Mi
