<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verdeazul Carbono</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #1d2b24; }
    h1 { font-size: 1.6rem; margin-bottom: .2rem; }
    p.sub { color: #55665c; margin-top: 0; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: .4rem 1rem; }
    dt { font-weight: 600; }
    code { font-size: .95em; }
  </style>
</head>
<body>
  <h1>Verdeazul Carbono</h1>
  <p class="sub">CE-1115 · Proyecto Parte 2 · Grupo 6</p>
  <p>El sistema está en línea por HTTPS.</p>
  <dl>
    <dt>Versión</dt><dd><code>{{ version }}</code>{% if commit %} (commit <code>{{ commit }}</code>){% endif %}</dd>
    <dt>Base de datos</dt><dd>conectada · PostgreSQL {{ postgres }} · PostGIS {{ postgis }}</dd>
  </dl>
</body>
</html>
