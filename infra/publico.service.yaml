# Comprobación pública de certificados (rol PUB). Abierto a internet (infra/desplegar.sh le da
# allUsers). Su usuario de base, va_publico, solo puede llamar a va_comprobar(codigo).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: verdeazul-publico
  labels:
    cloud.googleapis.com/location: us-east1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        # Una sola instancia: el límite de ritmo por origen vive en su memoria (C20).
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: sa-publico@verdeazul-ce1115-g6.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 30
      containers:
        - name: publico
          image: us-east1-docker.pkg.dev/verdeazul-ce1115-g6/verdeazul/publico:__VERSION__
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: CONSULTAS_POR_MINUTO
              value: "10"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-url-publico
                  key: "1"
          startupProbe:
            httpGet:
              path: /salud
              port: 8080
            periodSeconds: 2
            failureThreshold: 15
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
